version: "3.9"

services:
  backend:
    build: ./backend
    container_name: superkart-backend
    ports:
      - "7860:7860"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: superkart-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:7860
    depends_on:
      - backend
    restart: unless-stopped
